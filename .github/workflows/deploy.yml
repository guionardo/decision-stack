name: Deploy catalog to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone Quartz v4
        run: git clone --depth 1 --branch v4 https://github.com/jackyzha0/quartz.git quartz

      - name: Prepare content (strip personal sections)
        run: python3 .github/prepare_content.py quartz/content

      - name: Install deps, set baseUrl and build
        run: |
          cd quartz
          npm ci || npm install
          sed -i 's|baseUrl: ".*"|baseUrl: "guionardo.github.io/${{ github.event.repository.name }}"|' quartz.config.ts
          npx quartz build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
